version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: isl-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: isl-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_DIR=/app/models/isl_vit
      - CONFIDENCE_THRESHOLD=0.55
      - DEVICE=cpu

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isl-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/isl_translator
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=isl_production_jwt_secret_key_84920
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isl-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
